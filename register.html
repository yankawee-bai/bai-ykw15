<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1c2438; text-align: center; }
  .sub { text-align: center; color: #6b7386; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin: 14px 0 6px; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus, select:focus { outline: 2px solid #d97757; outline-offset: -1px; border-color: transparent; }
  .hint { font-size: 12px; color: #98a0b0; margin-top: 5px; }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    width: auto;
    margin: 0;
    padding: 4px 6px;
    font-size: 12px;
    color: #6b7386;
    cursor: pointer;
    font-weight: 600;
  }
  .pw-toggle:hover { background: none; color: #d97757; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #d97757;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #c8663f; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #e0526b; }
  .msg.success { color: #2fa876; }
  .link { text-align: center; margin-top: 18px; font-size: 13px; }
  .link a { color: #2b8ae0; text-decoration: none; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h1>สมัครสมาชิก</h1>
  <div class="sub">ระบบดูแลผู้สูงอายุ</div>

  <form id="registerForm" novalidate>
    <label for="fullName">ชื่อ-นามสกุล</label>
    <input type="text" id="fullName" autocomplete="name" required>

    <label for="email">อีเมล</label>
    <input type="email" id="email" autocomplete="email" required>

    <label for="password">รหัสผ่าน</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="new-password" required minlength="6">
      <button type="button" class="pw-toggle" id="pwToggle">แสดง</button>
    </div>
    <div class="hint">อย่างน้อย 6 ตัวอักษร</div>

    <label for="password2">ยืนยันรหัสผ่าน</label>
    <input type="password" id="password2" autocomplete="new-password" required>

    <label for="role">บทบาท</label>
    <select id="role" required>
      <option value="">-- เลือกบทบาท --</option>
      <option value="elderly">ผู้สูงอายุ / สมาชิกในครอบครัว</option>
      <option value="caregiver">ผู้ดูแล</option>
      <option value="medical">บุคลากรทางการแพทย์</option>
    </select>

    <button type="submit" id="submitBtn">สมัครสมาชิก</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></div>
</div>

<script>
 

  const HOME_BY_ROLE = {
    elderly:   "elderly-home.html",
    caregiver: "caregiver-dashboard.html",
    medical:   "medical-dashboard.html"
  };

  const form      = document.getElementById('registerForm');
  const msg       = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  const pwToggle  = document.getElementById('pwToggle');
  const pwInput   = document.getElementById('password');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "msg" + (type ? " " + type : "");
  }

  function setLoading(on) {
    submitBtn.disabled = on;
    submitBtn.textContent = on ? "กำลังสมัคร..." : "สมัครสมาชิก";
  }

  // แปลข้อความ error ของ Supabase เป็นภาษาไทยที่เข้าใจง่าย
  function translateError(message) {
    const m = (message || "").toLowerCase();
    if (m.includes("already registered") || m.includes("already been registered"))
      return "อีเมลนี้ถูกใช้สมัครไปแล้ว ลองเข้าสู่ระบบแทน";
    if (m.includes("rate limit"))
      return "ส่งคำขอถี่เกินไป กรุณารอสักครู่แล้วลองใหม่";
    if (m.includes("password") && m.includes("least"))
      return "รหัสผ่านสั้นเกินไป ต้องมีอย่างน้อย 6 ตัวอักษร";
    if (m.includes("invalid") && m.includes("email"))
      return "รูปแบบอีเมลไม่ถูกต้อง";
    if (m.includes("signups") && m.includes("disabled"))
      return "ระบบปิดรับสมัครสมาชิกอยู่ กรุณาติดต่อผู้ดูแลระบบ";
    return message || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
  }

  // ถ้าล็อกอินค้างอยู่แล้ว ไม่ต้องให้สมัครซ้ำ พาไปหน้าของ role นั้นเลย
  (async () => {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;
      const { data: profile } = await supabaseClient
        .from('profiles').select('role').eq('id', session.user.id).single();
      window.location.replace(HOME_BY_ROLE[profile && profile.role] || "login.html");
    } catch (_) { /* ถ้าเช็คไม่ได้ ก็ปล่อยให้อยู่หน้าสมัครตามปกติ */ }
  })();

  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.textContent = show ? 'ซ่อน' : 'แสดง';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName  = document.getElementById('fullName').value.trim();
    const email     = document.getElementById('email').value.trim().toLowerCase();
    const password  = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const role      = document.getElementById('role').value;

    // ตรวจข้อมูลฝั่งหน้าเว็บก่อน จะได้ไม่ยิงไป server ให้เปลืองโควตา
    if (!fullName)              return showMsg("กรุณากรอกชื่อ-นามสกุล", "error");
    if (!email.includes('@'))   return showMsg("กรุณากรอกอีเมลให้ถูกต้อง", "error");
    if (password.length < 6)    return showMsg("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", "error");
    if (password !== password2) return showMsg("รหัสผ่านทั้งสองช่องไม่ตรงกัน", "error");
    if (!role)                  return showMsg("กรุณาเลือกบทบาท", "error");

    setLoading(true);
    showMsg("");

    try {
      // 1) สมัครสมาชิกผ่าน Supabase Auth
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName, role: role } }
      });

      if (error) {
        showMsg("สมัครไม่สำเร็จ: " + translateError(error.message), "error");
        setLoading(false);
        return;
      }

      // กันกรณีเปิด Confirm email แล้ว Supabase ไม่คืน user กลับมา
      if (!data.user) {
        showMsg("สมัครสำเร็จ! กรุณาตรวจอีเมลเพื่อยืนยันตัวตนก่อนเข้าสู่ระบบ", "success");
        setLoading(false);
        return;
      }

      // 2) บันทึกข้อมูลเพิ่มเติมลงตาราง profiles
      const { error: profileError } = await supabaseClient
        .from('profiles')
        .insert([{ id: data.user.id, full_name: fullName, role: role }]);

      // 23505 = มีแถวนี้อยู่แล้ว (เช่นถ้าวันหลังไปเพิ่ม trigger) ไม่ถือว่าผิดพลาด
      if (profileError && profileError.code !== '23505') {
        showMsg("สมัครสำเร็จ แต่บันทึกโปรไฟล์ไม่สำเร็จ: " + profileError.message, "error");
        setLoading(false);
        return;
      }

      showMsg("สมัครสมาชิกสำเร็จ! กำลังพาไปหน้าเข้าสู่ระบบ...", "success");
      // ไม่เปิดปุ่มกลับ เพราะกำลังจะเปลี่ยนหน้า กันกดซ้ำ
      setTimeout(() => { window.location.href = "login.html"; }, 1500);

    } catch (err) {
      showMsg("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่", "error");
      console.error(err);
      setLoading(false);
    }
  });
</script>

</body>
</html>
