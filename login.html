<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1c2438; text-align: center; }
  .sub { text-align: center; color: #6b7386; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin: 14px 0 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus { outline: 2px solid #2b8ae0; outline-offset: -1px; border-color: transparent; }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    width: auto;
    margin: 0;
    padding: 4px 6px;
    font-size: 12px;
    color: #6b7386;
    cursor: pointer;
    font-weight: 600;
  }
  .pw-toggle:hover { background: none; color: #2b8ae0; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #2b8ae0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2276c4; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #e0526b; }
  .msg.success { color: #2fa876; }
  .link { text-align: center; margin-top: 18px; font-size: 13px; }
  .link a { color: #2b8ae0; text-decoration: none; }
  .link a:hover { text-decoration: underline; }
  .boot { text-align: center; padding: 60px 20px; color: #6b7386; font-size: 14px; }
</style>
</head>
<body>

<div class="boot" id="boot">กำลังตรวจสอบสถานะ...</div>

<div class="card" id="card" style="display:none">
  <h1>เข้าสู่ระบบ</h1>
  <div class="sub">ระบบดูแลผู้สูงอายุ</div>

  <form id="loginForm" novalidate>
    <label for="email">อีเมล</label>
    <input type="email" id="email" autocomplete="email" required>

    <label for="password">รหัสผ่าน</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pwToggle">แสดง</button>
    </div>

    <button type="submit" id="submitBtn">เข้าสู่ระบบ</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="link">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></div>
</div>

<script>
 

  const HOME_BY_ROLE = {
    elderly:   "elderly-home.html",
    caregiver: "caregiver-dashboard.html",
    medical:   "medical-dashboard.html"
  };

  const boot      = document.getElementById('boot');
  const card      = document.getElementById('card');
  const form      = document.getElementById('loginForm');
  const msg       = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  const pwToggle  = document.getElementById('pwToggle');
  const pwInput   = document.getElementById('password');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "msg" + (type ? " " + type : "");
  }

  function setLoading(on) {
    submitBtn.disabled = on;
    submitBtn.textContent = on ? "กำลังเข้าสู่ระบบ..." : "เข้าสู่ระบบ";
  }

  function showForm() {
    boot.style.display = 'none';
    card.style.display = 'block';
    document.getElementById('email').focus();
  }

  // แปลข้อความ error ของ Supabase เป็นภาษาไทยที่เข้าใจง่าย
  function translateError(message) {
    const m = (message || "").toLowerCase();
    if (m.includes("invalid login credentials"))
      return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
    if (m.includes("email not confirmed"))
      return "ยังไม่ได้ยืนยันอีเมล กรุณาตรวจกล่องจดหมายก่อน";
    if (m.includes("rate limit") || m.includes("too many"))
      return "พยายามเข้าสู่ระบบถี่เกินไป กรุณารอสักครู่";
    return message || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
  }

  // พาไปหน้าตาม role ที่ดึงมาจากตาราง profiles
  async function goToHome(userId) {
    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .single();

    if (error || !profile) return null;
    const target = HOME_BY_ROLE[profile.role];
    if (!target) return null;
    window.location.replace(target);
    return profile.role;
  }

  // ถ้าล็อกอินค้างอยู่แล้ว ข้ามหน้านี้ไปเลย ไม่ต้องกรอกซ้ำ
  (async () => {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && await goToHome(session.user.id)) return;
    } catch (_) { /* เช็คไม่ได้ก็แสดงฟอร์มตามปกติ */ }
    showForm();
  })();

  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.textContent = show ? 'ซ่อน' : 'แสดง';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email.includes('@')) return showMsg("กรุณากรอกอีเมลให้ถูกต้อง", "error");
    if (!password)            return showMsg("กรุณากรอกรหัสผ่าน", "error");

    setLoading(true);
    showMsg("");

    try {
      // 1) เข้าสู่ระบบผ่าน Supabase Auth
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showMsg(translateError(error.message), "error");
        setLoading(false);
        return;
      }

      // 2) ดึง role จากตาราง profiles แล้ว redirect ให้ถูกหน้า
      showMsg("เข้าสู่ระบบสำเร็จ! กำลังพาไป...", "success");
      const role = await goToHome(data.user.id);

      if (!role) {
        showMsg("เข้าสู่ระบบสำเร็จ แต่ไม่พบข้อมูลโปรไฟล์ กรุณาติดต่อผู้ดูแลระบบ", "error");
        setLoading(false);
      }
      // ถ้าเจอ role แล้วจะเปลี่ยนหน้าเอง ไม่ต้องเปิดปุ่มกลับ

    } catch (err) {
      showMsg("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่", "error");
      console.error(err);
      setLoading(false);
    }
  });
</script>

</body>
</html>
